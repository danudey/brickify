name: Release

# Cuts a release and publishes signed, attested binaries for every platform
# the project supports.
#
# The shape is: release-please holds a release pull request open against main,
# accumulating the changelog from conventional commit subjects. Merging that
# pull request tags the release, and the tag is what unblocks the build jobs.
# Nothing here runs on an ordinary merge.
#
# WHAT EACH ARTIFACT COMES WITH
#   archive.tar.gz            the binary, README and LICENSE
#   archive.tar.gz.sha256     the checksum, for a quick manual check
#   archive.tar.gz.sigstore   a Sigstore bundle: signature, certificate and
#                             inclusion proof in one file
#   archive.spdx.json         an SBOM of what went into the binary
#   SHA256SUMS(.sigstore)     every checksum in one signed file
#   plus, in GitHub's attestation store, a signed SLSA provenance statement
#   and a signed SBOM attestation for each archive
#
# None of that needs a key. Both the provenance and the cosign signature use
# the workflow's OIDC identity, so what a verifier checks is "this artifact
# was built by this workflow, in this repository, from this commit" rather
# than "somebody who holds a key said so". There is no private key to leak,
# rotate, or hand to a successor.
#
# HOW A USER VERIFIES IT
#   gh attestation verify ./tool-v1.2.3-x86_64-unknown-linux-musl.tar.gz \
#     --repo OWNER/REPO
#
#   cosign verify-blob \
#     --bundle tool-v1.2.3-x86_64-unknown-linux-musl.tar.gz.sigstore \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github.com/OWNER/REPO/' \
#     ./tool-v1.2.3-x86_64-unknown-linux-musl.tar.gz
#
# WHAT TO CHANGE
#   1. `BINARY_NAME` below. This is the one that matters: it is the `name` of
#      the `[[bin]]` target, and the stem of every archive.
#   2. `WORKING_DIRECTORY`, if Cargo.toml is not at the repository root.
#   3. The build matrix. `rustc --print target-list` prints every target.
#      Each entry becomes one archive on the release.
#   4. `EXTRA_FILES`, for anything else that belongs in the archive (a man
#      page, a shell completion, a default config).
#   5. The template's `publish-crate` job is deleted: brickify is an
#      application, not a crate for crates.io.
#
# WHAT IT NEEDS
#   - release-please-config.json and .release-please-manifest.json at the
#     repository root. See universal/ in this library for both.
#   - Squash merging with the pull request title as the commit subject:
#       Settings -> General -> Pull Requests -> Default commit message
#     release-please reads those subjects and nothing else.
#   - A public repository, or GitHub Advanced Security, for the attestation
#     steps. On a private repository without it, delete the two attest steps;
#     the cosign bundle still works.
#
# WHAT IT PRODUCES
#   - A GitHub release, tagged, with the artifacts above attached.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKING_DIRECTORY: "."
  # Not `TOOLCHAIN`: Windows env vars ignore case, and that name hides the
  # `toolchain` variable dtolnay/rust-toolchain sets for its own script.
  RUST_TOOLCHAIN: "stable"
  # The [[bin]] target name, and the stem of every archive.
  BINARY_NAME: "brickify"
  # Files copied into every archive alongside the binary. Space-separated.
  EXTRA_FILES: "README.md LICENSE"
  CARGO_TERM_COLOR: always

jobs:
  # Keeps a release pull request up to date with every conventional commit
  # landed on main. Merging it tags the release and unblocks the builds.
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: build (${{ matrix.target }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      # Uploading the artifacts to the release.
      contents: write
      # Requesting the OIDC token that both the attestations and the cosign
      # signature are bound to. Without this the signing steps fail with a
      # message about no token being available.
      id-token: write
      # Writing to the repository's attestation store.
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: glibc, built natively on each architecture's runner. Not
          # static musl, because winit and glow dlopen libGL, X11 and Wayland
          # at run time and a static binary cannot.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # macOS is built by build-macos below, which also produces a
          # universal binary from the two slices.
          # Windows: both architectures cross-build from the x64 runner.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          workspaces: ${{ env.WORKING_DIRECTORY }}

      - name: Build
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          TARGET: ${{ matrix.target }}
          # Removes the builder's absolute paths from the binary, which is
          # both a small privacy matter and a prerequisite for two builds of
          # the same commit producing the same bytes.
          RUSTFLAGS: "-C strip=symbols --remap-path-prefix=${{ github.workspace }}="
        run: cargo build --locked --release --all-features --target "$TARGET"

      - name: Package
        id: package
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          name="${BINARY_NAME}-${TAG}-${TARGET}"
          mkdir -p "staging/${name}"
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/${TARGET}/release/${BINARY_NAME}.exe" "staging/${name}/"
          else
            cp "target/${TARGET}/release/${BINARY_NAME}" "staging/${name}/"
          fi
          # Unquoted on purpose: EXTRA_FILES is a space-separated list.
          # shellcheck disable=SC2086
          [ -n "${EXTRA_FILES}" ] && cp ${EXTRA_FILES} "staging/${name}/"

          cd staging
          if [[ "$TARGET" == *windows* ]]; then
            archive="${name}.zip"
            7z a -tzip "$archive" "$name" >/dev/null
          else
            archive="${name}.tar.gz"
            tar czf "$archive" "$name"
          fi
          # sha256sum is not on the Windows runner's PATH under bash.
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi

          {
            echo "name=${name}"
            echo "archive=${archive}"
            echo "dir=${{ env.WORKING_DIRECTORY }}/staging"
          } >> "$GITHUB_OUTPUT"

      # A signed SLSA provenance statement: which workflow, at which commit,
      # on which runner, produced exactly these bytes. Stored by GitHub
      # against the repository, not in the release, and checked with
      # `gh attestation verify`.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.dir }}/${{ steps.package.outputs.archive }}

      # Syft reads Cargo.lock, so the SBOM lists the crates the binary was
      # actually built from rather than the ranges Cargo.toml allows.
      - name: Generate an SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ env.WORKING_DIRECTORY }}
          format: spdx-json
          output-file: ${{ steps.package.outputs.dir }}/${{ steps.package.outputs.name }}.spdx.json
          # This workflow attaches the SBOM to the release itself, below.
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ steps.package.outputs.dir }}/${{ steps.package.outputs.archive }}
          sbom-path: ${{ steps.package.outputs.dir }}/${{ steps.package.outputs.name }}.spdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Belt and braces alongside the attestation above. The attestation lives
      # in GitHub's store and needs `gh` to check; this bundle sits next to
      # the artifact and can be checked by anyone with cosign and no GitHub
      # account. Keyless: the certificate is issued to this workflow's OIDC
      # identity, so there is no key to manage.
      - name: Sign the archive
        shell: bash
        working-directory: ${{ steps.package.outputs.dir }}
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          COSIGN_YES: "true"
        run: cosign sign-blob --bundle "${ARCHIVE}.sigstore" "$ARCHIVE"

      - name: Upload to the release
        shell: bash
        working-directory: ${{ steps.package.outputs.dir }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          NAME: ${{ steps.package.outputs.name }}
        run: |
          gh release upload "$TAG" \
            "$ARCHIVE" \
            "${ARCHIVE}.sha256" \
            "${ARCHIVE}.sigstore" \
            "${NAME}.spdx.json" \
            --clobber

  # Both macOS slices plus a universal binary lipo'd from them. Kept out of
  # the matrix above because the universal artifact needs both builds in one
  # job.
  build-macos:
    name: build (apple-darwin)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: apple-darwin
          workspaces: ${{ env.WORKING_DIRECTORY }}

      - name: Build
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          RUSTFLAGS: "-C strip=symbols --remap-path-prefix=${{ github.workspace }}="
        run: |
          cargo build --locked --release --all-features --target aarch64-apple-darwin
          cargo build --locked --release --all-features --target x86_64-apple-darwin

      - name: Combine into a universal binary
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          set -euo pipefail
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            -output "target/universal-apple-darwin/release/${BINARY_NAME}" \
            "target/aarch64-apple-darwin/release/${BINARY_NAME}" \
            "target/x86_64-apple-darwin/release/${BINARY_NAME}"
          # lipo drops the linker's ad-hoc signature, and an unsigned binary
          # will not run on Apple Silicon at all. Re-sign ad-hoc.
          codesign --force --sign - "target/universal-apple-darwin/release/${BINARY_NAME}"
          lipo -info "target/universal-apple-darwin/release/${BINARY_NAME}"

      - name: Package
        id: package
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p staging
          for target in aarch64-apple-darwin x86_64-apple-darwin universal-apple-darwin; do
            name="${BINARY_NAME}-${TAG}-${target}"
            mkdir -p "staging/${name}"
            cp "target/${target}/release/${BINARY_NAME}" "staging/${name}/"
            # shellcheck disable=SC2086
            [ -n "${EXTRA_FILES}" ] && cp ${EXTRA_FILES} "staging/${name}/"
            (cd staging && tar czf "${name}.tar.gz" "$name" \
              && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          done
          echo "dir=${{ env.WORKING_DIRECTORY }}/staging" >> "$GITHUB_OUTPUT"

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.dir }}/*.tar.gz

      - name: Generate an SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ env.WORKING_DIRECTORY }}
          format: spdx-json
          output-file: ${{ steps.package.outputs.dir }}/apple-darwin.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ steps.package.outputs.dir }}/*.tar.gz
          sbom-path: ${{ steps.package.outputs.dir }}/apple-darwin.spdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and upload
        working-directory: ${{ steps.package.outputs.dir }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          for f in *.tar.gz; do
            cosign sign-blob --bundle "${f}.sigstore" "$f"
          done
          gh release upload "$TAG" ./* --clobber

  # One SHA256SUMS covering every platform, so a user or a package manager can
  # fetch a single file and check whichever archive they downloaded. Signed
  # too, because an unsigned checksum file is only as trustworthy as the
  # connection that fetched it.
  checksums:
    name: checksums
    needs: [release-please, build, build-macos]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Combine and sign the checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          mkdir sums && cd sums
          gh release download "$TAG" --pattern '*.sha256' --dir .
          # sorted, so the file is stable between runs regardless of the order
          # the matrix jobs happened to finish in.
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          cosign sign-blob --bundle SHA256SUMS.sigstore SHA256SUMS
          gh release upload "$TAG" SHA256SUMS SHA256SUMS.sigstore --clobber
